<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stundenplan</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<!-- ?v=N is a manual cache-buster: bump it whenever style.css changes and is
     pushed, so a visitor's browser can't end up with fresh HTML paired with a
     stale cached copy of the old CSS (see CONTRIBUTING.md). -->
<link rel="stylesheet" href="style.css?v=5" />
<script>
  // Sets the theme attribute before first paint, so a dark-mode choice
  // doesn't flash light while app.js (a deferred module script) loads.
  // Duplicates just the store key/shape read in store.js's getTheme —
  // keep the key in sync with STORE_KEY there.
  (function () {
    try {
      var raw = localStorage.getItem("stundenplan-store-v1");
      var theme = raw && JSON.parse(raw).theme;
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) {
      /* ignore: falls back to the system theme */
    }
  })();
</script>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="plan-controls">
        <select id="planSwitcher" class="plan-switcher" data-i18n-aria-label="planSwitcherLabel"></select>
        <button id="newPlanBtn" class="icon-btn" type="button" data-i18n-title="newPlanTitle" data-i18n-aria-label="newPlanTitle">+</button>
        <button id="deletePlanBtn" class="icon-btn" type="button" data-i18n-title="deletePlanTitle" data-i18n-aria-label="deletePlanTitle">🗑</button>
      </div>
      <div class="title-row">
        <h1 id="planTitle" contenteditable="true" spellcheck="false" data-i18n-title="renameHint"></h1>
        <button id="editLockBtn" class="icon-btn" type="button" data-i18n-title="lockEditingTitle" data-i18n-aria-label="lockEditingTitle">🔓</button>
      </div>
      <select id="themeSwitcher" class="header-select" data-i18n-aria-label="themeSwitcherLabel">
        <option value="system" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
      <select id="languageSwitcher" class="header-select" aria-label="Language / Sprache">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
      <button id="aboutBtn" class="icon-btn" type="button" data-i18n-title="aboutBtnTitle" data-i18n-aria-label="aboutBtnTitle">ⓘ</button>
    </div>
    <div class="app-actions">
      <div class="action-group">
        <span class="action-group-label" data-i18n="toolbarGroupData"></span>
        <button id="exportBtn" class="btn btn-secondary" data-i18n="exportBtn"></button>
        <button id="exportAllBtn" class="btn btn-secondary" data-i18n="exportAllBtn"></button>
        <button id="importBtn" class="btn btn-secondary" data-i18n="importBtn"></button>
        <input type="file" id="importFileInput" accept="application/json,.json" hidden />
      </div>
      <div class="action-group">
        <span class="action-group-label" data-i18n="toolbarGroupGrid"></span>
        <button id="timePresetBtn" class="btn btn-secondary" data-i18n="timePresetBtn"></button>
        <button id="addRowBtn" class="btn btn-secondary" data-i18n="addRowBtn"></button>
      </div>
      <div class="action-group">
        <span class="action-group-label" data-i18n="toolbarGroupView"></span>
        <button id="printBtn" class="btn btn-secondary" type="button" data-i18n="printBtn"></button>
        <button id="jumpToNowBtn" class="btn btn-secondary" type="button" data-i18n="jumpToNowBtn"></button>
        <label class="edit-icons-toggle">
          <input type="checkbox" id="editIconsToggle" checked />
          <span data-i18n="editIconsToggleLabel"></span>
        </label>
      </div>
      <div class="action-group reset-group">
        <button id="resetBtn" class="btn btn-danger-outline" data-i18n="resetBtn"></button>
      </div>
    </div>
  </header>

  <main>
    <p class="hint-text" data-i18n="hintText"></p>
    <div class="table-wrap">
      <table id="planTable">
        <thead>
          <tr id="headerRow">
            <th class="time-col">
              <span data-i18n="timeColHeader"></span>
              <div class="col-resize-handle" id="timeColResizeHandle" aria-hidden="true"></div>
            </th>
            <!-- day headers injected by JS -->
          </tr>
        </thead>
        <tbody id="planBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Brief, non-blocking feedback (undo confirmation, drag-overwrite
       notice, ...) — fixed position, shown/hidden via app.js's showToast(). -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Modal for editing a cell / range -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <form id="entryForm">
        <h2 id="modalTitleHeading"></h2>
        <p id="modalRangeInfo" class="modal-hint"></p>
        <label class="field">
          <span data-i18n="fieldTitleLabel"></span>
          <input type="text" id="fieldTitle" maxlength="80" autofocus data-i18n-placeholder="fieldTitlePlaceholder" />
        </label>
        <div class="field">
          <span data-i18n="fieldColorLabel"></span>
          <!-- Swatch buttons injected by app.js's buildColorSwatches(), one
               per rainbow hue plus a "no color" option — kept in sync with
               the same --day-1..7 palette used for day headers. -->
          <div class="color-swatches" id="colorSwatches" role="radiogroup" data-i18n-aria-label="fieldColorLabel"></div>
        </div>
        <div class="raster-inputs">
          <label class="field field-inline">
            <span data-i18n="fieldStartLabel"></span>
            <input type="time" id="fieldStartTime" />
          </label>
          <label class="field field-inline">
            <span data-i18n="fieldEndLabel"></span>
            <input type="time" id="fieldEndTime" />
          </label>
        </div>
        <p id="timeHint" class="modal-hint time-hint"></p>
        <!-- Only shown/relevant when creating a brand-new entry (see
             openEntryModal in app.js) — applying an already-existing entry
             to every day isn't this checkbox's job. -->
        <label class="field field-checkbox" id="applyAllDaysField">
          <input type="checkbox" id="applyAllDaysCheckbox" />
          <span data-i18n="applyAllDaysLabel"></span>
        </label>
        <label class="field">
          <span data-i18n="fieldDescriptionLabel"></span>
          <textarea id="fieldDescription" rows="4" maxlength="500" data-i18n-placeholder="fieldDescriptionPlaceholder"></textarea>
        </label>
        <label class="field">
          <span data-i18n="fieldLinkLabel"></span>
          <input type="url" id="fieldLink" placeholder="https://..." />
        </label>
        <div class="modal-actions">
          <button id="deleteEntryBtn" type="button" class="btn btn-danger" data-i18n="deleteEntryBtn"></button>
          <div class="modal-actions-right">
            <button id="cancelModalBtn" type="button" class="btn btn-secondary" data-i18n="cancelBtn"></button>
            <button id="saveEntryBtn" type="submit" class="btn" data-i18n="saveBtn"></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for setting the time grid -->
  <div id="timeModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <form id="timeForm">
        <h2 data-i18n="timeModalTitle"></h2>
        <p class="modal-hint" data-i18n="timeModalHint"></p>

        <div class="preset-list">
          <button type="button" class="btn btn-secondary preset-btn" data-preset="tu-dresden" data-i18n="presetTuDresden"></button>
          <button type="button" class="btn btn-secondary preset-btn" data-preset="rwth-aachen" data-i18n="presetRwthAachen"></button>
        </div>

        <hr class="modal-divider" />

        <span class="field-group-label" data-i18n="customRasterLabel"></span>
        <div class="raster-inputs">
          <label class="field field-inline">
            <span data-i18n="rasterIntervalLabel"></span>
            <input type="number" id="rasterInterval" min="5" step="5" value="120" list="rasterIntervalPresets" />
            <datalist id="rasterIntervalPresets">
              <option value="10"></option>
              <option value="15"></option>
              <option value="20"></option>
              <option value="30"></option>
              <option value="45"></option>
              <option value="60"></option>
              <option value="90"></option>
              <option value="120"></option>
            </datalist>
          </label>
          <label class="field field-inline">
            <span data-i18n="rasterFromLabel"></span>
            <input type="time" id="rasterStart" value="06:00" />
          </label>
          <label class="field field-inline">
            <span data-i18n="rasterToLabel"></span>
            <input type="time" id="rasterEnd" value="18:00" />
          </label>
        </div>
        <button type="submit" id="applyRasterBtn" class="btn" data-i18n="applyRasterBtn"></button>

        <div class="modal-actions">
          <div></div>
          <div class="modal-actions-right">
            <button id="cancelTimeModalBtn" type="button" class="btn btn-secondary" data-i18n="closeBtn"></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- About modal -->
  <div id="aboutModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 data-i18n="aboutModalTitle"></h2>
      <p class="modal-hint about-description" data-i18n="aboutModalDescription"></p>
      <div class="about-source">
        <span class="field-group-label" data-i18n="aboutModalSourceLabel"></span>
        <a
          id="aboutSourceLink"
          class="about-link"
          href="https://github.com/FionaPreroll/vibe-stundenplan"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="aboutModalSourceLinkText"
        ></a>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="modal-actions-right">
          <button id="closeAboutModalBtn" type="button" class="btn btn-secondary" data-i18n="closeBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
