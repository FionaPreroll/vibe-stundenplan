<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stundenplan</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="plan-controls">
        <select id="planSwitcher" class="plan-switcher" aria-label="Stundenplan wählen"></select>
        <button id="newPlanBtn" class="icon-btn" type="button" title="Neuen Stundenplan anlegen">+</button>
        <button id="deletePlanBtn" class="icon-btn" type="button" title="Diesen Stundenplan löschen">🗑</button>
      </div>
      <h1 id="planTitle" contenteditable="true" spellcheck="false" title="Klicken zum Umbenennen"></h1>
    </div>
    <div class="app-actions">
      <button id="exportBtn" class="btn btn-secondary">Exportieren</button>
      <button id="importBtn" class="btn btn-secondary">Importieren</button>
      <input type="file" id="importFileInput" accept="application/json,.json" hidden />
      <button id="timePresetBtn" class="btn btn-secondary">Zeiten festlegen</button>
      <button id="addRowBtn" class="btn">+ Zeile hinzufügen</button>
      <button id="resetBtn" class="btn btn-secondary">Zurücksetzen</button>
    </div>
  </header>

  <main>
    <p class="hint-text">Tipp: Zelle anklicken für einen Termin, oder über mehrere Zeitfenster ziehen für einen längeren Termin.</p>
    <div class="table-wrap">
      <table id="planTable">
        <thead>
          <tr id="headerRow">
            <th class="time-col">Zeit</th>
            <!-- day headers injected by JS -->
          </tr>
        </thead>
        <tbody id="planBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal for editing a cell / range -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <form id="entryForm">
        <h2 id="modalTitleHeading">Termin bearbeiten</h2>
        <p id="modalRangeInfo" class="modal-hint"></p>
        <label class="field">
          <span>Titel</span>
          <input type="text" id="fieldTitle" placeholder="z. B. Mathe lernen" maxlength="80" autofocus />
        </label>
        <div class="raster-inputs">
          <label class="field field-inline">
            <span>Start (optional)</span>
            <input type="time" id="fieldStartTime" />
          </label>
          <label class="field field-inline">
            <span>Ende (optional)</span>
            <input type="time" id="fieldEndTime" />
          </label>
        </div>
        <label class="field">
          <span>Beschreibung</span>
          <textarea id="fieldDescription" placeholder="Details zur Aufgabe..." rows="4" maxlength="500"></textarea>
        </label>
        <label class="field">
          <span>Link</span>
          <input type="url" id="fieldLink" placeholder="https://..." />
        </label>
        <div class="modal-actions">
          <button id="deleteEntryBtn" type="button" class="btn btn-danger">Löschen</button>
          <div class="modal-actions-right">
            <button id="cancelModalBtn" type="button" class="btn btn-secondary">Abbrechen</button>
            <button id="saveEntryBtn" type="submit" class="btn">Speichern</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for setting the time grid -->
  <div id="timeModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <form id="timeForm">
        <h2>Zeitraster festlegen</h2>
        <p class="modal-hint">
          Vorlage wählen oder eigenes Raster erstellen. Einträge bleiben erhalten, es werden nur die Zeit-Labels gesetzt.
        </p>

        <div class="preset-list">
          <button type="button" class="btn btn-secondary preset-btn" data-preset="tu-dresden">TU Dresden (Doppelstunden)</button>
          <button type="button" class="btn btn-secondary preset-btn" data-preset="rwth-aachen">RWTH Aachen (Blockraster)</button>
        </div>

        <hr class="modal-divider" />

        <span class="field-group-label">Eigenes Raster</span>
        <div class="raster-inputs">
          <label class="field field-inline">
            <span>Intervall (Min.)</span>
            <input type="number" id="rasterInterval" min="5" step="5" value="120" list="rasterIntervalPresets" />
            <datalist id="rasterIntervalPresets">
              <option value="10"></option>
              <option value="15"></option>
              <option value="20"></option>
              <option value="30"></option>
              <option value="45"></option>
              <option value="60"></option>
              <option value="90"></option>
              <option value="120"></option>
            </datalist>
          </label>
          <label class="field field-inline">
            <span>Von</span>
            <input type="time" id="rasterStart" value="06:00" />
          </label>
          <label class="field field-inline">
            <span>Bis</span>
            <input type="time" id="rasterEnd" value="18:00" />
          </label>
        </div>
        <button type="submit" id="applyRasterBtn" class="btn">Raster anwenden</button>

        <div class="modal-actions">
          <div></div>
          <div class="modal-actions-right">
            <button id="cancelTimeModalBtn" type="button" class="btn btn-secondary">Schließen</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
